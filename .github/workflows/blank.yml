
name: Build Devendra PDF Watermark EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          clean: true
          fetch-depth: 1

      - name: Locate project files
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "source"

          $candidates = @(
            $root,
            (Join-Path $root "devendra_pdf_watermark")
          )

          $project = $null

          foreach ($folder in $candidates) {
            $main = Join-Path $folder "main.py"
            $requirements = Join-Path $folder "requirements.txt"
            $logo = Join-Path $folder "Logo.png"

            if (
              (Test-Path $main) -and
              (Test-Path $requirements) -and
              (Test-Path $logo)
            ) {
              $project = $folder
              break
            }
          }

          if (!$project) {
            Write-Host "Repository root:"
            Get-ChildItem $root -Force

            throw "Required files not found together: main.py, requirements.txt, Logo.png"
          }

          "PROJECT_DIR=$project" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Project directory: $project"
          Get-ChildItem $project -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name DevendraPDF `
            --add-data "$env:PROJECT_DIR/Logo.png;." `
            "$env:PROJECT_DIR/main.py"

          if (!(Test-Path "dist/DevendraPDF.exe")) {
            throw "Build failed: DevendraPDF.exe was not created."
          }

      - name: Copy logo beside executable
        shell: pwsh
        run: |
          Copy-Item "$env:PROJECT_DIR/Logo.png" "dist/Logo.png"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DevendraPDF-Windows-x64
          path: |
            dist/DevendraPDF.exe
            dist/Logo.png
          if-no-files-found: error
          retention-days: 7
