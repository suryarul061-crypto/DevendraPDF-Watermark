
name: Build Devendra PDF Watermark EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Locate project files
        shell: pwsh
        run: |
          $candidates = @(
            ".",
            "devendra_pdf_watermark"
          )

          $project = $null

          foreach ($folder in $candidates) {
            if (
              (Test-Path (Join-Path $folder "main.py")) -and
              (Test-Path (Join-Path $folder "requirements.txt")) -and
              (Test-Path (Join-Path $folder "Logo.png"))
            ) {
              $project = $folder
              break
            }
          }

          if (!$project) {
            Write-Host "Repository files:"
            Get-ChildItem -Force
            throw "Cannot find main.py, requirements.txt and Logo.png together."
          }

          "PROJECT_DIR=$project" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Project directory: $project"
          Get-ChildItem $project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name DevendraPDF `
            "$env:PROJECT_DIR/main.py"

          if (!(Test-Path "dist/DevendraPDF.exe")) {
            throw "DevendraPDF.exe was not created."
          }

      - name: Copy company logo
        shell: pwsh
        run: |
          Copy-Item "$env:PROJECT_DIR/Logo.png" "dist/Logo.png"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DevendraPDF-Windows-x64
          path: |
            dist/DevendraPDF.exe
            dist/Logo.png
          if-no-files-found: error
          retention-days: 7
