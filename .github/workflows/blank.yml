
name: Build Devendra PDF Watermark EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Find project files
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "source"

          $mainFiles = Get-ChildItem `
            -Path $root `
            -Filter "main.py" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|\.venv|venv)[\\/]'
            }

          $project = $null

          foreach ($file in $mainFiles) {
            $folder = $file.Directory.FullName

            $requirements = Get-ChildItem `
              -Path $folder `
              -File |
              Where-Object { $_.Name -ieq "requirements.txt" } |
              Select-Object -First 1

            $logo = Get-ChildItem `
              -Path $folder `
              -File |
              Where-Object { $_.Name -ieq "Logo.png" } |
              Select-Object -First 1

            if ($requirements -and $logo) {
              $project = $folder
              break
            }
          }

          if (!$project) {
            Write-Host "Files found in repository:"
            Get-ChildItem $root -Recurse -File |
              Select-Object -ExpandProperty FullName

            throw "Could not find main.py, requirements.txt and Logo.png in one folder."
          }

          "PROJECT_DIR=$project" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Project folder found: $project"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name DevendraPDF `
            --add-data "$env:PROJECT_DIR/Logo.png;." `
            "$env:PROJECT_DIR/main.py"

          if (!(Test-Path "dist/DevendraPDF.exe")) {
            throw "DevendraPDF.exe was not created."
          }

      - name: Copy company logo
        shell: pwsh
        run: |
          Copy-Item "$env:PROJECT_DIR/Logo.png" "dist/Logo.png"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DevendraPDF-Windows-x64
          path: |
            dist/DevendraPDF.exe
            dist/Logo.png
          if-no-files-found: error
          retention-days: 7
