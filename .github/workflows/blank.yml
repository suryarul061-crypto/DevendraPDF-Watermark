
name: Build Devendra PDF Watermark EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name DevendraPDF main.py

      - name: Include company logo
        shell: pwsh
        run: |
          Copy-Item Logo.png dist/Logo.png

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevendraPDF-Windows-x64
          path: |
            dist/DevendraPDF.exe
            dist/Logo.png
          if-no-files-found: error
