
name: Build Devendra PDF Watermark EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find project files
        shell: pwsh
        run: |
          if (Test-Path "main.py") {
            $project = "."
          }
          elseif (Test-Path "devendra_pdf_watermark/main.py") {
            $project = "devendra_pdf_watermark"
          }
          else {
            throw "main.py not found. Check the repository folder structure."
          }

          if (!(Test-Path "$project/requirements.txt")) {
            throw "requirements.txt not found."
          }

          if (!(Test-Path "$project/Logo.png")) {
            throw "Logo.png not found. Upload the company logo."
          }

          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Project folder: $project"
          Get-ChildItem $project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name DevendraPDF `
            "$env:PROJECT_DIR/main.py"

          if (!(Test-Path "dist/DevendraPDF.exe")) {
            throw "EXE build failed."
          }

      - name: Include company logo
        shell: pwsh
        run: |
          Copy-Item "$env:PROJECT_DIR/Logo.png" "dist/Logo.png"

      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: DevendraPDF-Windows-x64
          path: |
            dist/DevendraPDF.exe
            dist/Logo.png
          if-no-files-found: error
          retention-days: 7
